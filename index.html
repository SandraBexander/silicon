<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="stylesheet" href="variables.css">
    <title>Silicon</title>
</head>

<body dark-theme="dark">
    <header>
        <div class="container">

            <nav class="navbar">
                <div class="logo-container">
                    <img src="/images/logo.svg" alt="Logo" class="logo"> <span> Silicon </span>
                </div>

                <div class="switch-and-button">
                    <span class="darkmode-text">Dark Mode</span>

                    <label class="switch">
                        <input type="checkbox">
                        <span class="slider round"></span>
                    </label>

                    <button class="menu" aria-label="Öppna meny">
                         <svg aria-hidden="true">
                            <use href="./images/test.svg"> </use>
                        </svg>

                    </button>
                    <a class="sign-in" href="#">
                        <img src="images/btn.svg" alt="Sign In">
                    </a>
                </div>
            </nav>
        </div>
    </header>
