<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How It Works</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="subscribe">
  <div class="subscribe-copy">
    <div class="bell">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-bell">
        <path d="M18 8c0-3.31-2.69-6-6-6S6 4.69 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
    </div>
    <p class="subscribe-text">Subscribe to our newsletter to stay informed about latest updates</p>
  </div>

  <form class="subscribe-form" action="https://example.com/subscribe" method="post">
    <input type="email" name="email" placeholder="Your email" required>
    <button type="submit">Subscribe</button>
  </form>
</div>

</body>
</html>
