<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
<link rel="stylesheet" href="styles.css">
    <title>Silicon</title>
</head>

<body>
    <!-- Header (Sandra) -->
    <header id="header">
        <div class="container">

            <nav class="navbar">
                <div class="logo-container">
                    <img src="/images/logo.svg" alt="Logo" class="logo"> <span> Silicon </span>
                </div>

                <div class="switch-and-button">
                    <span class="darkmode-text">Dark Mode</span>

                    <label class="switch">
                        <input type="checkbox">
                        <span class="slider round"></span>
                    </label>

                    <button class="menu" aria-label="Öppna meny">
                         <svg aria-hidden="true">
                            <use href="./images/test.svg"> </use>
                        </svg>

                    </button>
                    <a class="sign-in" href="#">
                        <img src="images/btn.svg" alt="Sign In">
                    </a>
                </div>
            </nav>
        </div>
    </header>

    <!-- Hero, Brands och Features (övriga gruppmedlemmar) läggs här -->

    <!-- How Does It Work? (Qustan) -->
    <section id="how-it-works">
        <div class="container">
            <h2>How Does It Work?</h2>

            <div class="phone-row">
                <img src="image/iPhone 12 Pro.png" alt="My budget screen" width="328" height="663">
                <img class="cards-image" src="image/iPhone 12 Pro@2x.png" alt="Your cards screen" width="328" height="663">
                <img src="image/iPhone 12 Pro..png" alt="Transfer screen" width="328" height="663">
            </div>

            <div class="transaction-copy">
                <h3>
                    <span class="only-desktop">Latest transaction history</span>
                    <span class="only-tablet">Step 3. Transfers to people from your contact list</span>
                    <span class="only-mobile">Transfers to people from your contact list</span>
                </h3>
                <p>Enim, et amet praesent pharetra. Mi non ante hendrerit amet sed. Arcu sociis tristique quisque hac in consectetur condimentum.</p>
            </div>
        </div>
    </section>

    <!-- FAQ, Contact, Subscribe och Footer (övriga gruppmedlemmar) läggs här -->

    <script src="script.js" defer></script>
</body>

</html>
