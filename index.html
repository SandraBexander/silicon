<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Newsletter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <button type="button" id="theme-toggle" class="theme-toggle">Byt läge</button>

  <div class="container">
    <section id="subscribe" class="newsletter">
      <div class="newsletter-box">
        <div class="newsletter-bell">
          <img class="newsletter-bell-icon" src="image/Vector.svg" alt="" width="78" height="78">
          <img class="newsletter-bell-badge" src="image/bl%C3%A5.svg" alt="" width="30" height="30">
        </div>

        <h2 class="newsletter-title">Subscribe to our newsletter<span class="newsletter-extra"> to stay informed about latest updates</span></h2>

        <form class="newsletter-form" action="#" method="post">
          <div class="newsletter-field">
            <svg class="newsletter-envelope" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">
              <rect x="1.5" y="3" width="13" height="10" rx="1.5"/>
              <path d="M2 4l6 5 6-5"/>
            </svg>
            <input type="email" name="email" placeholder="Your email" aria-label="Your email" required>
          </div>
          <button type="submit">Subscribe</button>
        </form>
      </div>
    </section>

    <p class="copyright">© 2025 Silicon. All rights reserved.</p>
  </div>

  <script>
    const root = document.documentElement;
    const toggle = document.getElementById('theme-toggle');
    let theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    root.setAttribute('data-theme', theme);

    toggle.addEventListener('click', function () {
      theme = theme === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', theme);
    });
  </script>
</body>
</html>
