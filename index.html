<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How It Works</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="subscribe">
  <div class="subscribe-copy">
    <div class="bell">
      <img src="image/bell.svg" alt="bell icon">
    </div>
    <strong class="subscribe-text">Subscribe to our newsletter to stay informed about latest updates</strong>
  </div>

  <form class="subscribe-form" action="https://example.com/subscribe" method="post">
    <input type="email" name="email" placeholder="Your email" required>
    <button type="submit">Subscribe</button>
  </form>
</div>

</body>
</html>
